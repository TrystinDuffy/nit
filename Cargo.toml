[package]
name = "nit"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "A tiny, single-executable YubiKey-backed encrypted secret vault"
license = "MIT"
publish = false

[dependencies]
aes = "0.8"
age = "0.11"
age-core = "0.11"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
bech32 = "0.11"
bip39 = "2.2"
chacha20poly1305 = "0.10"
cipher = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
des = "0.8"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
pcsc = "2.9"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = "0.29"
rpassword = "7.3"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.13"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
