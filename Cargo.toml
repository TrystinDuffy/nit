[package]
name = "git-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "An append-only, Git-native, hardware-backed encrypted secret vault"
license = "MIT"
publish = false

[dependencies]
aes = "0.8"
anyhow = "1.0"
chacha20poly1305 = "0.10"
cipher = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
des = "0.8"
ed25519-dalek = "2.1"
hex = "0.4"
hkdf = "0.12"
pcsc = "2.9"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = "0.29"
rpassword = "7.3"
sha2 = "0.10"
subtle = "2.6"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSError", "NSString", "std"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["LAContext", "LAPublicDefines", "block2", "std"] }
security-framework = { version = "3.7", default-features = false, features = ["OSX_10_13"] }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
